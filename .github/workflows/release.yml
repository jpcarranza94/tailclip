name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux clipboard dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf tailclip-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release tailclip
          shasum -a 256 tailclip-${{ matrix.target }}.tar.gz \
            > tailclip-${{ matrix.target }}.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tailclip-${{ matrix.target }}.tar.gz
            tailclip-${{ matrix.target }}.tar.gz.sha256
